<div id="sto-snippet-preview-templates" class="sto-snippet-preview-templates" hidden aria-hidden="true">
	<template data-sto-preview="responsive_select">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · responsive control</div>
			<div class="sto-preview-mock__panel">
				<div class="sto-preview-mock__tabs">
					<button type="button" class="sto-preview-mock__tab is-on">Desktop</button>
					<button type="button" class="sto-preview-mock__tab">Tablet</button>
					<button type="button" class="sto-preview-mock__tab">Mobile</button>
				</div>
				<label class="sto-preview-mock__lab">Column gap</label>
				<div class="sto-preview-mock__select"><span>24 px</span><span class="sto-preview-mock__chev" aria-hidden="true">▾</span></div>
			</div>
		</div>
	</template>
	<template data-sto-preview="select">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · select</div>
			<div class="sto-preview-mock__panel">
				<label class="sto-preview-mock__lab">Layout density</label>
				<div class="sto-preview-mock__select"><span>Comfortable</span><span class="sto-preview-mock__chev" aria-hidden="true">▾</span></div>
			</div>
		</div>
	</template>
	<template data-sto-preview="dynamic_object">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · dynamic options</div>
			<div class="sto-preview-mock__panel">
				<label class="sto-preview-mock__lab">Font source</label>
				<div class="sto-preview-mock__select"><span>Google Fonts</span><span class="sto-preview-mock__chev" aria-hidden="true">▾</span></div>
				<p class="sto-preview-mock__hint">Options can be loaded from PHP callbacks or remote lists.</p>
			</div>
		</div>
	</template>
	<template data-sto-preview="input">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · text input</div>
			<div class="sto-preview-mock__panel">
				<label class="sto-preview-mock__lab">Site title suffix</label>
				<div class="sto-preview-mock__input">My brand</div>
			</div>
		</div>
	</template>
	<template data-sto-preview="switcher">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · toggle</div>
			<div class="sto-preview-mock__panel sto-preview-mock__row">
				<span class="sto-preview-mock__lab" style="margin:0">Sticky header</span>
				<span class="sto-preview-mock__switch" aria-hidden="true"><span class="sto-preview-mock__switch-knob"></span></span>
			</div>
		</div>
	</template>
	<template data-sto-preview="color">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · color</div>
			<div class="sto-preview-mock__panel sto-preview-mock__row">
				<span class="sto-preview-mock__lab" style="margin:0">Primary</span>
				<span class="sto-preview-mock__swatch" style="background:#7f54b3"></span>
				<code class="sto-preview-mock__hex">#7f54b3</code>
			</div>
		</div>
	</template>
	<template data-sto-preview="background">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · background</div>
			<div class="sto-preview-mock__panel">
				<div class="sto-preview-mock__row">
					<span class="sto-preview-mock__mini">Color</span>
					<span class="sto-preview-mock__swatch" style="background:#1d2327"></span>
				</div>
				<div class="sto-preview-mock__row" style="margin-top:10px">
					<span class="sto-preview-mock__mini">Image</span>
					<span class="sto-preview-mock__ph">hero.jpg</span>
				</div>
			</div>
		</div>
	</template>
	<template data-sto-preview="link_color">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · link color</div>
			<div class="sto-preview-mock__panel">
				<div class="sto-preview-mock__row"><span class="sto-preview-mock__mini">Normal</span><span class="sto-preview-mock__swatch" style="background:#2271b1"></span></div>
				<div class="sto-preview-mock__row" style="margin-top:8px"><span class="sto-preview-mock__mini">Hover</span><span class="sto-preview-mock__swatch" style="background:#135e96"></span></div>
			</div>
		</div>
	</template>
	<template data-sto-preview="border">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · border</div>
			<div class="sto-preview-mock__panel">
				<div class="sto-preview-mock__fakebox">Card with border controls (width, style, radius, color).</div>
			</div>
		</div>
	</template>
	<template data-sto-preview="range">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · range</div>
			<div class="sto-preview-mock__panel">
				<label class="sto-preview-mock__lab">Logo height</label>
				<div class="sto-preview-mock__range"><span class="sto-preview-mock__range-fill"></span><span class="sto-preview-mock__range-thumb"></span></div>
				<div class="sto-preview-mock__row" style="margin-top:6px;font-size:11px;color:#888"><span>40</span><span>px</span></div>
			</div>
		</div>
	</template>
	<template data-sto-preview="typography">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · typography</div>
			<div class="sto-preview-mock__panel">
				<div class="sto-preview-mock__row"><span class="sto-preview-mock__mini">Family</span><div class="sto-preview-mock__select" style="flex:1"><span>Inter</span><span class="sto-preview-mock__chev">▾</span></div></div>
				<div class="sto-preview-mock__row" style="margin-top:10px"><span class="sto-preview-mock__mini">Weight</span><div class="sto-preview-mock__select" style="flex:1"><span>600</span><span class="sto-preview-mock__chev">▾</span></div></div>
			</div>
		</div>
	</template>
	<template data-sto-preview="image_select">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · image select</div>
			<div class="sto-preview-mock__thumbs">
				<div class="sto-preview-mock__thumb is-on"></div>
				<div class="sto-preview-mock__thumb"></div>
				<div class="sto-preview-mock__thumb"></div>
			</div>
		</div>
	</template>
	<template data-sto-preview="button_group">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · button group</div>
			<div class="sto-preview-mock__panel">
				<div class="sto-preview-mock__btns">
					<button type="button" class="sto-preview-mock__btn is-on">Left</button>
					<button type="button" class="sto-preview-mock__btn">Center</button>
					<button type="button" class="sto-preview-mock__btn">Right</button>
				</div>
			</div>
		</div>
	</template>
	<template data-sto-preview="code_editor">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · code editor</div>
			<div class="sto-preview-mock__code">
				<span class="tok-k">return</span> <span class="tok-s">'&lt;style&gt;'</span> . <span class="tok-fn">esc_html</span>( <span class="tok-v">$css</span> );
			</div>
		</div>
	</template>
	<template data-sto-preview="tabs">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · tabs field</div>
			<div class="sto-preview-mock__panel">
				<div class="sto-preview-mock__fieldtabs">
					<button type="button" class="is-on">General</button>
					<button type="button">Advanced</button>
				</div>
				<label class="sto-preview-mock__lab">Option A</label>
				<div class="sto-preview-mock__input" style="margin-top:4px">Value</div>
			</div>
		</div>
	</template>
	<template data-sto-preview="accordion">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · accordion field</div>
			<div class="sto-preview-mock__panel">
				<div class="sto-preview-mock__acc">
					<div class="sto-preview-mock__acc-h is-open"><span>Branding</span><span class="sto-preview-mock__chev">▾</span></div>
					<div class="sto-preview-mock__acc-b">Logo upload, tagline…</div>
					<div class="sto-preview-mock__acc-h"><span>Layout</span><span class="sto-preview-mock__chev">▸</span></div>
				</div>
			</div>
		</div>
	</template>
	<template data-sto-preview="group">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · group</div>
			<div class="sto-preview-mock__panel sto-preview-mock__groupbox">
				<strong class="sto-preview-mock__gtitle">Hero</strong>
				<label class="sto-preview-mock__lab">Title</label>
				<div class="sto-preview-mock__input">Welcome</div>
			</div>
		</div>
	</template>
	<template data-sto-preview="group_inner">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Inside a group · inferred select</div>
			<div class="sto-preview-mock__panel">
				<label class="sto-preview-mock__lab">Columns</label>
				<div class="sto-preview-mock__select"><span>3</span><span class="sto-preview-mock__chev">▾</span></div>
			</div>
		</div>
	</template>
	<template data-sto-preview="group_tabs">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · group + tabs</div>
			<div class="sto-preview-mock__panel sto-preview-mock__groupbox">
				<div class="sto-preview-mock__fieldtabs">
					<button type="button" class="is-on">Content</button>
					<button type="button">Design</button>
				</div>
				<label class="sto-preview-mock__lab">Heading</label>
				<div class="sto-preview-mock__input">Featured</div>
			</div>
		</div>
	</template>
	<template data-sto-preview="group_accordion">
		<div class="sto-preview-mock">
			<div class="sto-preview-mock__cap">Theme settings · group + accordion</div>
			<div class="sto-preview-mock__panel sto-preview-mock__groupbox">
				<div class="sto-preview-mock__acc">
					<div class="sto-preview-mock__acc-h is-open"><span>Block A</span><span class="sto-preview-mock__chev">▾</span></div>
					<div class="sto-preview-mock__acc-b">Nested fields…</div>
				</div>
			</div>
		</div>
	</template>
</div>
